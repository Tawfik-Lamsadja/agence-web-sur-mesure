name: Déploiement Azure Static Web Apps

on:
  push:
    branches:
      - claude/plugin-marketplace-nextlevelbuilder-2nsea3
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - claude/plugin-marketplace-nextlevelbuilder-2nsea3

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Construire et déployer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Déployer
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: "api"
          output_location: ""
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Fermer l'environnement de préversion
    steps:
      - name: Fermer
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
